[project]
name = "ableton-mcp"
version = "1.0.0"
description = "Ableton Live integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.3.0",
]

[project.optional-dependencies]
standalone = [
    "openai>=1.0.0",
    "anthropic>=0.21.0",
    "aiohttp>=3.8.0",
]
web = [
    "openai>=1.0.0",
    "anthropic>=0.21.0",
    "aiohttp>=3.8.0",
    "flask>=2.3.0",
    "flask-socketio>=5.3.0",
    "requests>=2.31.0",
]

[project.scripts]
ableton-mcp = "MCP_Server.server:main"
ableton-mcp-app = "standalone_app.main:main"
ableton-mcp-web = "standalone_app.web_app:main"
ableton-mcp-launch = "launch_standalone:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["MCP_Server", "standalone_app"]

[project.urls]
"Homepage" = "https://github.com/ahujasid/ableton-mcp"
"Bug Tracker" = "https://github.com/ahujasid/ableton-mcp/issues"